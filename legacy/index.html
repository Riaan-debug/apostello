<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apostellō Café — Business Hub</title>

  <!-- ── Favicon & app icons ──────────────────────────── -->
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- ── Social / share preview ───────────────────────── -->
  <meta property="og:title"       content="Apostellō Café — Business Hub">
  <meta property="og:description" content="not just served, Sent.">
  <meta property="og:image"       content="https://apostellodashboard.netlify.app/og-image.png">
  <meta property="og:url"         content="https://apostellodashboard.netlify.app/">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:title"      content="Apostellō Café — Business Hub">
  <meta name="twitter:image"      content="https://apostellodashboard.netlify.app/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ── SIDEBAR ────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="logo.svg" alt="Apostellō" class="sidebar-logo">
        <div class="brand-slogan">not just served, Sent.</div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-sec="hub">      <span class="ni">⊞</span><span class="nav-label"> Hub</span></button>
        <button class="nav-btn"        data-sec="crm">      <span class="ni">♡</span><span class="nav-label"> CRM &amp; Loyalty</span></button>
        <button class="nav-btn"        data-sec="recipes">  <span class="ni">☕</span><span class="nav-label"> Recipes &amp; Menu</span></button>
        <button class="nav-btn"        data-sec="stock">    <span class="ni">◫</span><span class="nav-label"> Stock Take</span></button>
        <button class="nav-btn"        data-sec="daily">    <span class="ni">≡</span><span class="nav-label"> Daily Log</span></button>
        <button class="nav-btn"        data-sec="pnl">      <span class="ni">↗</span><span class="nav-label"> Weekly P&amp;L</span></button>
        <button class="nav-btn"        data-sec="monthly">  <span class="ni">◎</span><span class="nav-label"> Monthly</span></button>
        <div class="nav-divider"><span class="nav-label">Operations</span></div>
        <button class="nav-btn"        data-sec="checklist"><span class="ni">✓</span><span class="nav-label"> Checklists</span></button>
        <button class="nav-btn"        data-sec="orders">   <span class="ni">⊕</span><span class="nav-label"> Purchase Log</span></button>
        <button class="nav-btn"        data-sec="suppliers"><span class="ni">◈</span><span class="nav-label"> Suppliers</span></button>
        <button class="nav-btn"        data-sec="maintenance"><span class="ni">⚒</span><span class="nav-label"> Maintenance</span></button>
        <button class="nav-btn"        data-sec="settings"> <span class="ni">⚙</span><span class="nav-label"> Settings</span></button>
      </nav>
      <button class="collapse-btn" id="collapseBtn" onclick="toggleSidebar()">
        <span class="collapse-icon" id="collapseIcon">◀</span><span class="nav-label"> Collapse</span>
      </button>
      <div class="sidebar-foot" id="sidebarDate"></div>
    </aside>

    <!-- ── MAIN ──────────────────────────────────────────────── -->
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="topbar-brand">
          <span class="tb-name">Apostellō Café</span>
          <span class="tb-sep">·</span>
          <h1 class="page-title" id="pageTitle">Hub</h1>
        </div>
        <span class="topbar-date" id="topbarDate"></span>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>

  <!-- ── MODAL ─────────────────────────────────────────────── -->
  <div class="modal-bg" id="modalBg">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- ── TOAST ─────────────────────────────────────────────── -->
  <div class="toast" id="toast"></div>

  <!-- ── KIOSK ─────────────────────────────────────────────── -->
  <div id="kiosk" class="kiosk-overlay" style="display:none">
    <div class="kiosk-inner">
      <div class="kiosk-wordmark">
        <img src="logo.svg" alt="Apostellō" class="kiosk-logo">
      </div>
      <div class="kiosk-tagline">not just served, Sent.</div>
      <div id="kioskBody"></div>
    </div>
    <button class="kiosk-staff-btn" onclick="kioskPinPrompt()">Staff ·</button>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
